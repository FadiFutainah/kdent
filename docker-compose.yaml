services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel-app

    restart: unless-stopped

    working_dir: /var/www

    env_file:
      - .env

    volumes:
      - ./storage:/var/www/storage

    networks:
      - laravel

    depends_on:
      mysql:
        condition: service_healthy


  # Queue worker
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel-queue-worker

    restart: unless-stopped

    working_dir: /var/www

    env_file:
      - .env

    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

    volumes:
      - ./storage:/var/www/storage

    networks:
      - laravel

    depends_on:
      mysql:
        condition: service_healthy


  # Check expired inventory
  inventory-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel-inventory-worker

    restart: unless-stopped

    working_dir: /var/www

    env_file:
      - .env

    command: php artisan inventory:check-expired

    volumes:
      - ./storage:/var/www/storage

    networks:
      - laravel

    depends_on:
      mysql:
        condition: service_healthy


  # Send payment reminders
  payment-reminder-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel-payment-reminder-worker

    restart: unless-stopped

    working_dir: /var/www

    env_file:
      - .env

    command: php artisan reminders:send-payment

    volumes:
      - ./storage:/var/www/storage

    networks:
      - laravel

    depends_on:
      mysql:
        condition: service_healthy


  nginx:
    image: nginx:1.27-alpine

    container_name: laravel-nginx

    restart: unless-stopped

    ports:
      - "0.0.0.0:8083:80"

    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - laravel


  mysql:
    image: mysql:8.0

    container_name: laravel-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_USERNAME}",
          "-p${DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  laravel:


volumes:
  mysql_data:
